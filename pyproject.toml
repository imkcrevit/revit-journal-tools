[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revit-journal-tools"
version = "0.2.0"
description = "Local Revit Journal terminal viewer with paragraph grouping and traceable error analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
revit-journal = "revit_journal_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revit_journal_tools = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
